name: Mirror to GitLab

# Pushes every commit on main to GitLab immediately after it lands.
# Setup required (one-time, in GitHub repo Settings → Secrets):
#   GITLAB_TOKEN  — a GitLab "Project Access Token" with write_repository scope
#   GITLAB_REPO   — the full GitLab project path, e.g. biomassives/exotopia-org

on:
  push:
    branches: [main]
  workflow_dispatch:   # allow manual trigger from the Actions tab

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0      # full history required for mirror push

      - name: Push to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_REPO:  ${{ secrets.GITLAB_REPO }}
        run: |
          if [ -z "$GITLAB_TOKEN" ] || [ -z "$GITLAB_REPO" ]; then
            echo "::error::GITLAB_TOKEN and/or GITLAB_REPO repo secrets are not set — see docs/git-collaboration-guide.md"
            exit 1
          fi
          git remote add gitlab "https://oauth2:${GITLAB_TOKEN}@gitlab.com/${GITLAB_REPO}.git"
          # Plain --force, not --force-with-lease: this is a one-way mirror where
          # GitHub main is always authoritative. --force-with-lease compares against
          # a local remote-tracking ref for gitlab/main that this job never fetches
          # (the gitlab remote is added fresh every run), so it has no baseline to
          # compare against and was failing this exact way even with valid secrets.
          git push gitlab main --force
          echo "Mirrored to gitlab.com/${GITLAB_REPO} ✓"
