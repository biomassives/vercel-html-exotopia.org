<svg viewBox="0 0 420 88" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="lg-star" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ffd480" stop-opacity="0.9"/>
      <stop offset="50%"  stop-color="#ffd480" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffd480" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lg-base" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#00aaff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00aaff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ── Icon area (left 80px) ───────────────────────────────── -->
  <!-- Host star -->
  <circle cx="40" cy="14" r="11" fill="url(#lg-star)"/>
  <circle cx="40" cy="14" r="2.8" fill="#ffd480"/>

  <!-- Star transit arc -->
  <path d="M 10 55 Q 40 6 70 55"
        fill="none" stroke="#ffd480" stroke-width="0.7"
        stroke-opacity="0.3" stroke-dasharray="2,4"/>

  <!-- Dome interior -->
  <path d="M 10 57 A 30 30 0 0 1 70 57 Z"
        fill="#003366" fill-opacity="0.07"/>

  <!-- Latitude rings -->
  <ellipse cx="40" cy="48" rx="28"  ry="2.8"  fill="none" stroke="#0099dd" stroke-width="0.6" opacity="0.47"/>
  <ellipse cx="40" cy="38" rx="22"  ry="2.2"  fill="none" stroke="#0099dd" stroke-width="0.55" opacity="0.37"/>
  <ellipse cx="40" cy="31" rx="14"  ry="1.5"  fill="none" stroke="#0099dd" stroke-width="0.5" opacity="0.3"/>

  <!-- Meridians -->
  <path d="M 20 57 A 20 30 0 0 1 60 57"
        fill="none" stroke="#0099dd" stroke-width="0.7" opacity="0.47"/>
  <path d="M 30 57 A 10 30 0 0 1 50 57"
        fill="none" stroke="#0099dd" stroke-width="0.65" opacity="0.4"/>
  <line x1="40" y1="27" x2="40" y2="57"
        stroke="#0099dd" stroke-width="0.65" opacity="0.48"/>

  <!-- Outer dome arc -->
  <path d="M 10 57 A 30 30 0 0 1 70 57"
        fill="none" stroke="#0099dd" stroke-width="2" opacity="0.92"/>

  <!-- Ground glow + line -->
  <ellipse cx="40" cy="57" rx="31" ry="3.5" fill="url(#lg-base)"/>
  <line x1="5" y1="57" x2="75" y2="57"
        stroke="#1a3a4a" stroke-width="1" opacity="0.7"/>

  <!-- Pyramid -->
  <polygon points="40,40 33,57 47,57"
           fill="#ffcc44" fill-opacity="0.12"
           stroke="#ffcc44" stroke-width="0.9" opacity="0.8"/>

  <!-- ── Text area ───────────────────────────────────────────── -->
  <!-- EXOTOPIA wordmark -->
  <text x="92" y="50"
        font-family="'Courier New', Courier, monospace"
        font-size="32" font-weight="700"
        letter-spacing="5"
        fill="#00e5ff">EXOTOPIA</text>

  <!-- Subtitle -->
  <text x="93" y="68"
        font-family="'Courier New', Courier, monospace"
        font-size="10" font-weight="400"
        letter-spacing="3.5"
        fill="#4ecdc4" opacity="0.8">EXOPLANET SETTLEMENT NETWORK</text>

  <!-- Separator line -->
  <line x1="92" y1="56" x2="400" y2="56"
        stroke="#0099dd" stroke-width="0.5" opacity="0.3"/>
</svg>
