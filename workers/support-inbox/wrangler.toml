name = "vercel-html-exotopia-org"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# Create with: wrangler kv namespace create RATE_LIMIT_KV
# then paste the returned id below.
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Non-secret config — safe to commit.
[vars]
# Comma-separated list of origins allowed to POST to this worker.
ALLOWED_ORIGIN = "https://exotopia.org"

# Secrets (never committed) — set each with:
#   wrangler secret put SUPABASE_URL
#   wrangler secret put SUPABASE_SERVICE_ROLE_KEY
#   wrangler secret put RESEND_API_KEY
#   wrangler secret put RESEND_FROM_EMAIL       e.g. "Exotopia Support <support@exotopia.org>"
#   wrangler secret put SUPPORT_REPLY_TO        shared monitored inbox, e.g. support@exotopia.org
#   wrangler secret put TURNSTILE_SECRET_KEY
#   wrangler secret put ADMIN_ALERT_EMAIL       where urgent (bug) alerts go
